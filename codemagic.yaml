workflows:
  ios-unsigned:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Prepare environment configuration
        script: |
          if [ ! -f "src/config/env.ts" ]; then
            echo "src/config/env.ts not found in git repository."
            if [ -f "src/config/env.example.ts" ]; then
              echo "Creating fallback src/config/env.ts from src/config/env.example.ts to ensure bundling succeeds..."
              cp src/config/env.example.ts src/config/env.ts
            fi
          fi
      - name: Install npm dependencies
        script: |
          npm install
      - name: Expo prebuild iOS
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build and package unsigned iOS IPA
        script: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: No .xcworkspace found in ios directory"
            exit 1
          fi
          echo "Found workspace: $WORKSPACE"

          APP_PROJECT=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          if [ -z "$APP_PROJECT" ]; then
            echo "Error: No .xcodeproj found in ios directory"
            exit 1
          fi
          SCHEME=$(basename "$APP_PROJECT" .xcodeproj)
          echo "Application Project: $APP_PROJECT"
          echo "Building Scheme: $SCHEME"

          BUILD_DIR="$PWD/build"
          rm -rf "$BUILD_DIR"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          echo "Searching for compiled .app bundle..."
          APP_PATH=$(find "$BUILD_DIR" -name "${SCHEME}.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$BUILD_DIR" -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$BUILD_DIR" ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate .app file. Listing build directory contents:"
            find "$BUILD_DIR" -maxdepth 4 -ls 2>/dev/null || true
            exit 1
          fi

          echo "Found application bundle at: $APP_PATH"
          rm -rf Payload app-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr app-unsigned.ipa Payload
          rm -rf Payload

          ls -lh app-unsigned.ipa
          echo "Successfully created app-unsigned.ipa!"
    artifacts:
      - app-unsigned.ipa
